<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker Calendar</title>
  <!-- Tints the phone status bar. Kept in step with the body background by
       ThemeManager, since the theme is a manual choice rather than a media
       query and the manifest can only carry one fixed colour. -->
  <meta name="theme-color" content="#f5f5f5">
  <link rel="stylesheet" href="styles.css?v=2.0.3">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-header">
    <h1>Habit Tracker 📅</h1>
    <button id="manage-habits-button" class="header-action" title="Manage habits" aria-label="Manage habits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <!--
    Shown only when a backup has not happened in a week, and dismissible. It
    sits here rather than in settings because the whole problem is that nobody
    opens settings to do this.
  -->
  <div class="backup-nudge" id="backup-nudge" hidden>
    <span class="backup-nudge-text" id="backup-nudge-text"></span>
    <button class="backup-nudge-action" id="backup-nudge-action">Back up</button>
    <button class="backup-nudge-dismiss" id="backup-nudge-dismiss" title="Remind me later" aria-label="Remind me later">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <input type="file" id="import-file-input" accept=".json" style="display: none;">
  <div class="calendar-header">
    <button id="prev-month" title="Previous month" aria-label="Previous month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 id="month-year"></h2>
    <button id="next-month" title="Next month" aria-label="Next month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="weekdays">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="calendar" id="calendar"></div>
  <div class="habits-list" id="habits-list"></div>
  <div class="modal" id="manage-modal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="manage-modal-title" tabindex="-1">
      <div class="modal-header">
        <h2 id="manage-modal-title">Manage Habits</h2>
        <button onclick="closeManageModal()" class="modal-close" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-about" id="modal-about" tabindex="-1" hidden>
        <h3 class="about-name">Habit Tracker</h3>
        <p class="about-version" id="about-version">v2.0.3</p>
        <p class="about-line">A calendar for the things you are trying to do more of, and less of.</p>
        <p class="about-line">Everything is kept on this device. There is no account and no server, so back it up from time to time.</p>
        <button class="about-action" id="about-guide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h7a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>
          Show the guide again
        </button>
        <a class="about-link" href="https://github.com/rtcfirefly/habit-tracker" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-1-2.6c3.1-.4 6.4-1.6 6.4-7A5.4 5.4 0 0 0 20 4.8a5 5 0 0 0-.1-3.7s-1.2-.4-3.9 1.5a13.4 13.4 0 0 0-7 0C6.3.7 5.1 1.1 5.1 1.1a5 5 0 0 0-.1 3.7 5.4 5.4 0 0 0-1.5 3.7c0 5.4 3.3 6.6 6.4 7A3.4 3.4 0 0 0 9 18.1V22"/></svg>
          Source on GitHub
        </a>
        <button class="about-back" id="about-back">Back</button>
      </div>
      <div class="modal-body">
        <div id="manage-form"></div>
        <!--
          Export, import and appearance live here rather than in the header: they
          are occasional, and a permanent row of them cost 65px above the
          calendar. This section sits outside #manage-form, which renderForm()
          clears on every change.
        -->
        <!--
          One row, not three: these are occasional actions and a labelled row
          each spent more of the dialog on them than they are worth. The titles
          carry the wording the labels used to.
        -->
        <!--
          Hidden where the File System Access API is missing, which is most
          browsers other than Chrome. The state is always on show because this
          backup pauses on its own each session and one that has quietly stopped
          is worse than none.
        -->
        <div class="file-backup" id="file-backup" hidden>
          <span class="file-backup-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 17.6A4 4 0 0 0 18 10h-1.3A7 7 0 1 0 5 16.3"/><polyline points="9 15 12 12 15 15"/><line x1="12" y1="12" x2="12" y2="21"/></svg>
          </span>
          <span class="file-backup-label" id="file-backup-label"></span>
          <button class="file-backup-action" id="file-backup-action"></button>
        </div>
        <!--
          Always shown, unlike the file backup row above it: the reminder is
          the one part of backup that works without the File System Access
          API, since it can fall back to an export.
        -->
        <label class="backup-remind" for="backup-remind-toggle">
          <span class="backup-remind-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </span>
          <span class="backup-remind-label">Remind me to back up</span>
          <input type="checkbox" id="backup-remind-toggle" class="backup-remind-toggle">
        </label>
        <div class="modal-footer">
          <div class="footer-actions">
            <button id="export-button" class="footer-action" title="Export data — downloads a backup" aria-label="Export data">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="import-button" class="footer-action" title="Import data — replaces everything" aria-label="Import data">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </button>
            <button id="theme-toggle-button" class="footer-action" title="Switch between light and dark" aria-label="Switch appearance">
              <svg class="when-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <svg class="when-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
            </button>
            <button id="about-button" class="footer-action" title="About this app" aria-label="About this app">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7.6" x2="12" y2="7.7"/></svg>
            </button>
          </div>
          <span class="modal-version">v2.0.3</span>
        </div>
      </div>
    </div>
  </div>
<script src="emoji-utils.js?v=2.0.3"></script>
<script src="data-manager.js?v=2.0.3"></script>
<script src="file-backup.js?v=2.0.3"></script>
<script src="calendar-view.js?v=2.0.3"></script>
<script src="habits-view.js?v=2.0.3"></script>
<script src="day-sheet.js?v=2.0.3"></script>
<script src="habit-manager.js?v=2.0.3"></script>
<script src="intro.js?v=2.0.3"></script>
<script src="theme-manager.js?v=2.0.3"></script>
<script src="import-export-manager.js?v=2.0.3"></script>
<script src="script.js?v=2.0.3"></script>
</body>
</html>
