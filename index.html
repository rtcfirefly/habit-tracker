<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker Calendar</title>
  <link rel="stylesheet" href="styles.css?v=7">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-header">
    <h1>Habit Tracker 📅</h1>
    <button id="manage-habits-button" class="header-action" title="Manage habits" aria-label="Manage habits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <input type="file" id="import-file-input" accept=".json" style="display: none;">
  <div class="calendar-header">
    <button id="prev-month" title="Previous month" aria-label="Previous month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2 id="month-year"></h2>
    <button id="next-month" title="Next month" aria-label="Next month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="weekdays">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="calendar" id="calendar"></div>
  <div class="habits-list" id="habits-list"></div>
  <div class="modal" id="manage-modal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="manage-modal-title">
      <div class="modal-header">
        <h2 id="manage-modal-title">Habit Tracker</h2>
        <button onclick="closeManageModal()" title="Close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div id="manage-form"></div>
        <!--
          Export, import and appearance live here rather than in the header: they
          are occasional, and a permanent row of them cost 65px above the
          calendar. This section sits outside #manage-form, which renderForm()
          clears on every change.
        -->
        <!--
          One row, not three: these are occasional actions and a labelled row
          each spent more of the dialog on them than they are worth. The titles
          carry the wording the labels used to.
        -->
        <div class="modal-footer">
          <div class="footer-actions">
            <button id="export-button" class="footer-action" title="Export data — downloads a backup" aria-label="Export data">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="import-button" class="footer-action" title="Import data — replaces everything" aria-label="Import data">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </button>
            <button id="theme-toggle-button" class="footer-action" title="Switch between light and dark" aria-label="Switch appearance">
              <svg class="when-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <svg class="when-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
            </button>
          </div>
          <span class="modal-version">v7</span>
        </div>
      </div>
    </div>
  </div>
<script src="emoji-utils.js?v=7"></script>
<script src="data-manager.js?v=7"></script>
<script src="calendar-view.js?v=7"></script>
<script src="habits-view.js?v=7"></script>
<script src="habit-manager.js?v=7"></script>
<script src="theme-manager.js?v=7"></script>
<script src="import-export-manager.js?v=7"></script>
<script src="script.js?v=7"></script>
</body>
</html>
