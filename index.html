<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker Calendar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>Habit Tracker 📅</h1>
  <div class="form">
    <button id="manage-habits-button">⚙️</button>
    <button id="export-button">📤</button>
    <button id="import-button">📥</button>
    <button id="theme-toggle-button">🌙</button>
  </div>
  <input type="file" id="import-file-input" accept=".json" style="display: none;">
  <div class="calendar-header">
    <button id="prev-month">◀️</button>
    <h2 id="month-year"></h2>
    <button id="next-month">▶️</button>
  </div>
  <div class="weekdays">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="calendar" id="calendar"></div>
  <div class="habits-list" id="habits-list"></div>
  <div class="modal" id="manage-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Manage Habits</h2>
        <button onclick="closeManageModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="manage-form"></div>
      </div>
    </div>
  </div>
<script src="data-manager.js"></script>
<script src="calendar-view.js"></script>
<script src="habits-view.js"></script>
<script src="habit-manager.js"></script>
<script src="theme-manager.js"></script>
<script src="import-export-manager.js"></script>
<script src="script.js"></script>
</body>
</html>
