<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker Calendar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <h1>Habit Tracker 📅</h1>
  <div class="form">
    <button id="manage-habits-button">Manage Habits</button>
    <button id="theme-toggle-button">🌙 Dark Mode</button>
  </div>
  <div class="calendar-header">
    <button id="prev-month">&#8592; Prev</button>
    <h2 id="month-year"></h2>
    <button id="next-month">Next &#8594;</button>
  </div>
  <div class="weekdays">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="calendar" id="calendar"></div>
  <div class="habits-list" id="habits-list"></div>
  <div class="modal" id="manage-modal">
    <div class="modal-content">
      <div id="manage-form"></div>
      <button onclick="closeManageModal()">Done Managing</button>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
