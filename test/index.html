<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker tests</title>
  <!-- The real stylesheet, so the layout assertions measure the real thing -->
  <link rel="stylesheet" href="../styles.css">
  <style>
    h1 { font-size: 1.4rem; }

    #summary {
      position: sticky;
      top: 0;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    #summary.pass { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    #summary.fail { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    #summary button { padding: 0.35rem 0.8rem; font-size: 0.85rem; }

    .notice { padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.9rem; }
    .notice.good { background: #e8f5e9; color: #1b5e20; }
    .notice.warn { background: #fff3cd; color: #664d03; white-space: pre-wrap; }

    h2.section { font-size: 1rem; margin: 1.4rem 0 0.4rem; }
    .hint { font-size: 0.85rem; opacity: 0.75; margin: 0.2rem 0 0; }

    ul.results { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; }
    /* Deliberately not a flex row: a flex gap is visual only, so a copied
       failure came out as "FAILthe assertion..." with nothing between them */
    ul.results li { padding: 0.15rem 0; }
    ul.results li.pass { color: #2e7d32; }
    ul.results li.fail { color: #c62828; font-weight: bold; }

    /* A pseudo-element, so the tick is not picked up when the page is copied
       and cannot end up on the line below in a pasted excerpt */
    ul.results li.pass::before { content: '\2713\00a0'; }

    .mark {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      background: #c62828;
      color: #fff;
      border-radius: 3px;
      padding: 0.05rem 0.3rem;
    }
    .detail { opacity: 0.85; font-weight: normal; }

    .summary-actions { display: flex; gap: 0.5rem; flex: none; }

    #fixtures-toggle { margin-top: 1.5rem; font-size: 0.85rem; padding: 0.35rem 0.8rem; }
    #fixtures { margin-top: 1rem; }
    #fixtures[hidden] { display: none; }

    #frames {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
      margin-top: 1rem;
    }
    figure.frame { margin: 0; }
    figure.frame figcaption {
      font-size: 0.8rem;
      font-weight: bold;
      opacity: 0.8;
      margin-bottom: 0.25rem;
    }
    figure.frame iframe {
      height: 620px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #fff;
      display: block;
    }
    .notice button { margin-left: 0.75rem; padding: 0.3rem 0.7rem; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Habit Tracker tests</h1>

  <div id="summary">Running…</div>
  <div id="notice"></div>
  <div id="results"></div>

  <h2 class="section">Viewport previews</h2>
  <p class="hint">
    Each frame is a real viewport at a fixed width, so the media queries inside it
    respond to the frame rather than to this window. The measurements above are taken
    from these.
  </p>
  <div id="frames"></div>

  <button id="fixtures-toggle">Show rendered fixtures</button>
  <!-- Laid out at page width during the run so boxes can be measured -->
  <div id="fixtures"></div>

  <!--
    The app's classes only. script.js is deliberately absent: it is the
    bootstrap and queries #calendar, #month-year and friends, which do not
    exist here. theme-manager.js and import-export-manager.js are left out for
    the same reason - their constructors take elements from the real page.
  -->
  <script src="../back-trap.js"></script>
  <script src="../emoji-utils.js"></script>
  <script src="../data-manager.js"></script>
  <script src="../file-backup.js"></script>
  <script src="../calendar-view.js"></script>
  <script src="../habits-view.js"></script>
  <script src="../habit-manager.js"></script>
  <script src="../intro.js"></script>

  <script src="tests.js"></script>
  <script src="browser-runner.js"></script>
</body>
</html>
